[package]
name = "raptor-llm"
version = "0.1.1"
description = "Raptor LLM local AI runtime"
authors = ["Raptor LLM"]
edition = "2021"

[lib]
name = "raptor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
raptor-core = { path = "../crates/raptor-core" }
raptor-runtime = { path = "../crates/raptor-runtime" }
raptor-models = { path = "../crates/raptor-models" }
raptor-context = { path = "../crates/raptor-context" }
raptor-gateway = { path = "../crates/raptor-gateway" }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }
reqwest.workspace = true
tokio-util = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = "6"
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[dev-dependencies]
tempfile = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
