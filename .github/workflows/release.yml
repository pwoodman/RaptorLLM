name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check release tag and app versions
        run: node scripts/check-release-tag.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Check whether hosted signing is configured
        id: signing
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $available = (-not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)).ToString().ToLowerInvariant()
          "available=$available" >> $env:GITHUB_OUTPUT

      - name: Build Windows installers for local signing
        if: steps.signing.outputs.available == 'false'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target -Force | Out-Null
          Set-Content -LiteralPath target/unsigned-release.json -Value '{"bundle":{"createUpdaterArtifacts":false}}' -Encoding utf8NoBOM
          npm run tauri -- build --ci --config target/unsigned-release.json --bundles nsis,msi -- --locked
          exit $LASTEXITCODE

      - name: Upload installers for local signing
        if: steps.signing.outputs.available == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-for-local-signing
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Build and publish signed updater artifacts
        if: steps.signing.outputs.available == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Raptor LLM ${{ github.ref_name }}
          releaseBody: See the generated release notes for changes in this version.
          releaseDraft: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
